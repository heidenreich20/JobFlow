spring.application.name=jobflow

spring.datasource.url=jdbc:postgresql://localhost:5432/jobflow?options=-c%20TimeZone=UTC
spring.datasource.username=jobflow
spring.datasource.password=${JOBFLOW_DB_PASSWORD:jobflow_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.jackson.time-zone=UTC

jobflow.jwt.secret=${JOBFLOW_JWT_SECRET}
jobflow.jwt.expiration-ms=86400000